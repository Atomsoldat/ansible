# This is the packages provided by nvidia
# Upstream proprietary drivers yaaay
- name: Install nvidia related packages using apt
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    pkg:
      - nvidia-container-toolkit
      - nvidia-driver-cuda
      - nvidia-driver
      - nvidia-kernel-open-dkms
      - linux-headers-amd64
  become: true