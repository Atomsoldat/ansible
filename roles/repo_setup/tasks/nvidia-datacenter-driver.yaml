---
- name: Nvidia Datacenter Driver repo | Get apt key
  ansible.builtin.get_url:
    # TODO: move hardcoded value somewhere more central
    # https://developer.download.nvidia.com/compute/cuda/repos/
    url: https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/8793F200.pub
    dest: /usr/share/keyrings/nvidia-datacenter-driver.asc
    checksum: sha256:09edb5196bca272c091633d4e04dd6c8f3a07278834868220aa669c895f6cfd7
    mode: '0644'
  become: true

- name: Nvidia Datacenter Driver repo | Dearmor the downloaded signing key
  ansible.builtin.command:
    cmd: gpg --batch --dearmor -o /usr/share/keyrings/nvidia-datacenter-driver.gpg /usr/share/keyrings/nvidia-datacenter-driver.asc
    creates: /usr/share/keyrings/nvidia-datacenter-driver.gpg
  become: true

- name: Nvidia Datacenter Driver repo | Add apt config file
  ansible.builtin.template:
    src: "nvidia-datacenter-driver.sources.j2"
    dest: "/etc/apt/sources.list.d/nvidia-datacenter-driver.sources"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    #- stable
    # - experimental
